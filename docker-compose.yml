services:
  dashboard:
    build: .
    image: cifracontrol-dashboard:latest
    container_name: cifracontrol
    ports:
      - "3000:3000"
    environment:
      - SIMULATED_DELAY_MS=900
    volumes:
      - uploads_data:/app/uploads
      - clean_data:/app/data          # datos limpios del pipeline (current.json)
    restart: unless-stopped

volumes:
  uploads_data:
  clean_data:
